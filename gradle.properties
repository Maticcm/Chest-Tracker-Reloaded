# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
# Now on the 26.2 target (staged via 26.1.2). See PORTING.md.
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Parchment has no 26.x data (it tops out at 1.21.11), so we use pure Mojang mappings.
# Parchment only supplies parameter names/javadocs, so this has zero effect on compiled output.

# Mod Properties
mod_version=3.0.0
maven_group=red.jackf
archives_base_name=chesttrackerreloaded

# Dependencies
fabric-api_version=0.156.0+26.2
yacl_version=3.9.6+26.2-fabric

# Mod Compat
# Wired back up at the 26.2 hop; 26.1.2 builds are not published for all of these.
searchables_version=26.2:1.0.1
modmenu_version=20.0.0-beta.2
shulkerboxtooltip_version=5.4.0+26.2
wthit_version=fabric-20.0.0
jade_version=JB4B8a9g

# Compat currently DROPPED (no 26.x builds exist upstream) - see PORTING.md
#   litematica / malilib - the bundled libs/ jars are 1.21.3 only
#   expanded-storage     - no 26.x release

mod_name=ChestTracker Reloaded
