# Builds the mod on every push and pull request, so breakage is caught before release.
name: build

on:
  pull_request:
  push:
    branches-ignore:
      - 'crowdin_*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Verifies the checked-in gradle-wrapper.jar matches a known good release, so a
      # tampered wrapper cannot execute arbitrary code in CI.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # Minecraft 26.x requires Java 25.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Loom's remapped Minecraft cache lives outside the usual Gradle caches;
          # including it avoids re-downloading Minecraft on every run.
          gradle-home-cache-includes: |
            caches
            notifications
            loom-cache

      - name: Make Gradle wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew check build --stacktrace

      - name: Upload artifacts
        # One OS is enough - the jars are identical.
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: build/libs/*.jar
          if-no-files-found: error
