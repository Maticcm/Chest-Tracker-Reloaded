# Creates a GitHub Release with the built jars when a version tag is pushed.
#
# Deliberately does NOT publish to Modrinth or CurseForge. Upstream's workflow did,
# but it was wired to JackFred's project IDs and Maven credentials. If you want
# distributor publishing later, add it with your OWN project IDs and tokens.
#
# Usage:
#   git tag v3.0.0
#   git push origin v3.0.0
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a release from (e.g. v3.0.0)'
        required: true
        type: string

permissions:
  # Needed to create the release. Scoped to this repository only.
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-includes: |
            caches
            notifications
            loom-cache

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Resolve version
        id: version
        run: |
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "mod_version=$MOD_VERSION"   >> "$GITHUB_OUTPUT"
          echo "mc_version=$MC_VERSION"     >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"                   >> "$GITHUB_OUTPUT"
          echo "Building $MOD_VERSION for Minecraft $MC_VERSION from tag $TAG"

      # Guards against tagging v3.0.1 while gradle.properties still says 3.0.0,
      # which would silently publish a jar whose filename disagrees with the tag.
      - name: Check tag matches mod_version
        run: |
          EXPECTED="v${{ steps.version.outputs.mod_version }}"
          ACTUAL="${{ steps.version.outputs.tag }}"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Tag $ACTUAL does not match mod_version ($EXPECTED in gradle.properties)."
            exit 1
          fi

      - name: Build
        run: ./gradlew check build --stacktrace

      - name: Resolve changelog
        id: changelog
        run: |
          FILE="changelogs/${{ steps.version.outputs.mod_version }}.md"
          if [ -f "$FILE" ]; then
            echo "Using $FILE"
            echo "file=$FILE" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No changelog at $FILE; release notes will be auto-generated."
            echo "file=" >> "$GITHUB_OUTPUT"
          fi

      # Uses the preinstalled GitHub CLI rather than a third-party action, so the
      # release step pulls in no external code.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Chest Tracker ${{ steps.version.outputs.mod_version }} for ${{ steps.version.outputs.mc_version }}"
          ARGS=(--title "$TITLE")
          if [ -n "${{ steps.changelog.outputs.file }}" ]; then
            ARGS+=(--notes-file "${{ steps.changelog.outputs.file }}")
          else
            ARGS+=(--generate-notes)
          fi
          gh release create "${{ steps.version.outputs.tag }}" \
            build/libs/*.jar \
            "${ARGS[@]}"
